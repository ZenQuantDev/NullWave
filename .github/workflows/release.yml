name: Release
on:
  push:
    tags: ['v*']            # only a tag creates/publishes a GitHub Release
  workflow_dispatch: {}     # branch test: builds + uploads artifacts, publishes nothing

permissions:
  contents: write           # needed for the tag-gated release publish

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      # reuse the validated script: produces full (self-contained) + fx (framework-dependent)
      - run: ./build-release.ps1 -Rid win-x64
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: win-x64, path: publish-artifacts/** }

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      # self-contained publish -> tarball. AppImage is a separate opt-in step
      # (needs appimagetool + a runtime); left as TODO so the matrix ships green first.
      - run: |
          dotnet publish NullWave.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishReadyToRun=true -o publish-linux
          tar -czf nullwave-linux-x64.tar.gz -C publish-linux .
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64, path: nullwave-linux-x64.tar.gz }

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      # unsigned tarballs for both arches; .dmg + notarization is a separate certified step.
      - run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish NullWave.csproj -c Release -r $rid --self-contained true -o publish-$rid
            tar -czf nullwave-$rid.tar.gz -C publish-$rid .
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: nullwave-*.tar.gz }

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')      # tag-only; dispatch runs stop at artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: assets }
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**
          generate_release_notes: false             # notes come from CHANGELOG [0.6.6] in the ceremony